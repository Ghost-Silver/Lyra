<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>揽星 · Lyra — 6 轴机械臂控制台</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>揽星 · Lyra</h1>
    <span class="sub">桌面 6 轴机械臂 · 实时 3D 控制台</span>
    <span id="conn" class="badge off">离线</span>
    <span id="col-warn" class="badge off" style="margin-left: 8px; background: #ff5252;">碰撞警告</span>
  </header>
  <main>
    <section id="viewport"></section>
    <aside id="panel">
      <div class="card">
        <h2>状态</h2>
        <div id="status-grid">
          <div>模式 <b id="st-mode">–</b></div>
          <div>时间 <b id="st-t">–</b>s</div>
          <div>末端 <b id="st-ee">–</b></div>
          <div>RPY <b id="st-rpy">–</b></div>
        </div>
        <div class="sig-row">奇异度 σ<sub>min</sub>
          <div class="bar"><div id="sig-bar"></div></div>
          <span id="sig-val">–</span>
        </div>
      </div>

      <div class="card">
        <h2>前馈力矩 (动力学)</h2>
        <div id="torques-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 13px; text-align: center;">
          <div>J1: <span id="tau1">0.0</span></div>
          <div>J2: <span id="tau2">0.0</span></div>
          <div>J3: <span id="tau3">0.0</span></div>
          <div>J4: <span id="tau4">0.0</span></div>
          <div>J5: <span id="tau5">0.0</span></div>
          <div>J6: <span id="tau6">0.0</span></div>
        </div>
      </div>

      <div class="card">
        <h2>关节滑杆</h2>
        <div id="joints"></div>
        <label>速度倍率 <input type="range" id="speed" min="0.05" max="1" step="0.05" value="0.4" /><span id="speed-v">0.40</span></label>
        <label class="row"><input type="checkbox" id="follow" checked /> 松手后下发目标（拖动中实时跟随）</label>
      </div>

      <div class="card">
        <h2>末端控制</h2>
        <label class="row"><input type="checkbox" id="drag-mode" /> 3D 拖拽末端（平移，姿态跟随）</label>
        <div class="pose-inputs">
          <label>X <input id="px" type="number" step="0.01" /></label>
          <label>Y <input id="py" type="number" step="0.01" /></label>
          <label>Z <input id="pz" type="number" step="0.01" /></label>
          <label>R <input id="pr" type="number" step="0.05" /></label>
          <label>P <input id="pp" type="number" step="0.05" /></label>
          <label>Y <input id="pw" type="number" step="0.05" /></label>
        </div>
        <div class="btn-row">
          <button id="go-ee">IK移动(PTP)</button>
          <button id="go-ee-line">直线插补(Line)</button>
        </div>
        <div class="btn-row">
          <button id="demo-circle">圆弧演示(Circle)</button>
          <button id="demo-path">连续折线演示(Blend)</button>
        </div>
        <label>夹爪 <input type="range" id="grip" min="0" max="1" step="0.01" value="0" /></label>
      </div>

      <div class="card">
        <h2>示教 / 回放</h2>
        <div class="btn-row">
          <button id="teach-add">记录点</button>
          <button id="teach-clear">清空</button>
          <button id="teach-play">回放</button>
          <button id="teach-export">导出示教</button>
        </div>
        <div>示教点：<b id="teach-n">0</b></div>
        <textarea id="demo-out" placeholder="导出的示教 JSON（可喂给 RL 预训练）"></textarea>
      </div>

      <div class="card">
        <h2>抓取编排</h2>
        <button id="grasp-here">在当前末端位置执行抓取</button>
        <div class="hint">接近 → 下降 → 闭爪 → 上提</div>
      </div>

      <div class="card">
        <h2>防碰撞测试</h2>
        <div class="btn-row">
          <button id="add-obstacle">在末端前方生成障碍</button>
          <button id="clear-obstacles">清除障碍</button>
        </div>
        <div class="hint">自碰撞与环境碰撞由底层安全层兜底</div>
      </div>

      <div class="card danger">
        <div class="btn-row">
          <button id="estop" class="estop">急停</button>
          <button id="estop-clear">解除</button>
          <button id="reset">复位</button>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
